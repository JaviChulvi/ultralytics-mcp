[project]
name = "ultralytics-mcp"
version = "0.1.0"
description = "Hosted MCP server exposing the Ultralytics Platform API as AI-assistant tools"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ultralytics", email = "hello@ultralytics.com" }]
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultralytics_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits the real platform API; requires ULTRALYTICS_TEST_API_KEY",
]
addopts = "-m 'not live'"
