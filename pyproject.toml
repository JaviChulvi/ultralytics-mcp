[project]
name = "ultralytics-mcp"
version = "0.1.0"
description = "MCP server for the Ultralytics Platform, powered by the official Python SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ultralytics", email = "hello@ultralytics.com" }]
dependencies = [
    "fastmcp>=3.4,<4",
    "ultralytics-platform==0.1.21",
]

[project.scripts]
ultralytics-mcp = "ultralytics_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultralytics_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Ultralytics Platform"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
